<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="232" viewBox="0 0 1120 232" role="img" aria-labelledby="title desc">
  <title id="title">AnyAngle Studio batch views</title>
  <desc id="desc">Choose camera angles or saved views, render independent guide snapshots, queue the current Qwen workflow, then save final images and download guide archives.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182936"/><stop offset="1" stop-color="#0b1119"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5ce0ec"/><stop offset="1" stop-color="#7592ff"/></linearGradient>
  </defs>
  <rect width="1120" height="232" rx="20" fill="url(#bg)"/>
  <text x="32" y="38" fill="#dff5fa" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">ANYANGLE STUDIO · MULTI-VIEW</text>
  <text x="1088" y="38" fill="#7eb5c9" font-family="Arial, sans-serif" font-size="12" text-anchor="end">BATCH WORKFLOW / 1.1.0</text>
  <g fill="#15232f" stroke="#324654"><rect x="32" y="65" width="244" height="127" rx="13"/><rect x="303" y="65" width="244" height="127" rx="13"/><rect x="574" y="65" width="244" height="127" rx="13"/><rect x="845" y="65" width="243" height="127" rx="13"/></g>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g fill="url(#accent)" font-size="12" font-weight="700" letter-spacing="2"><text x="50" y="90">01 / CAMERA VIEWS</text><text x="321" y="90">02 / GUIDE SNAPSHOTS</text><text x="592" y="90">03 / QWEN QUEUE</text><text x="863" y="90">04 / SAVE OUTPUTS</text></g>
    <g fill="#eef7fb" font-size="20" font-weight="700"><text x="50" y="126">角度步进 / 收藏机位</text><text x="321" y="126">逐机位独立引导图</text><text x="592" y="126">沿用当前工作流</text><text x="863" y="126">最终图 + 粗图 ZIP</text></g>
    <g fill="#97adbd" font-size="13"><text x="50" y="154">0° → 330° / 30° = 12 views</text><text x="321" y="154">One scene, one PNG per view</text><text x="592" y="154">Same seed &amp; sampler settings</text><text x="863" y="154">PNG metadata + task manifest</text><text x="50" y="176">0° → 360° / 1° = 360 views</text><text x="321" y="176">3D / mannequin POSE / Canny</text><text x="592" y="176">Sequential ComfyUI jobs</text><text x="863" y="176">Pause future submissions</text></g>
  </g>
  <g fill="#70d7e8"><path d="M282 119h9v-5l9 10-9 10v-5h-9z"/><path d="M553 119h9v-5l9 10-9 10v-5h-9z"/><path d="M824 119h9v-5l9 10-9 10v-5h-9z"/></g>
  <text x="32" y="215" fill="#6f899d" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">LIVE CAMERA RESTORED AFTER BATCH · QUEUED JOBS CONTINUE WHEN SUBMISSIONS STOP</text>
</svg>
