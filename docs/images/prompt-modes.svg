<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">AnyAngle Studio: dual-image and single-guide workflows</title>
  <desc id="desc">The default workflow uses an original photo and a guide. Single-guide mode uses Qwen base with a guide and text description, without an original photo. Image roles can be swapped; custom prompts are output verbatim.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c27"/><stop offset="1" stop-color="#071018"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#50c9df"/></marker></defs>
  <rect width="1120" height="440" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="34" y="43" fill="#eef8ff" font-size="21" font-weight="700" letter-spacing="2">ANYANGLE STUDIO</text><text x="1086" y="41" text-anchor="end" fill="#71d6e7" font-size="12" letter-spacing="1">PROMPT MODES · v1.3</text>
  <rect x="28" y="70" width="518" height="261" rx="12" fill="#14232e" stroke="#304b5d"/>
  <rect x="574" y="70" width="518" height="261" rx="12" fill="#102b34" stroke="#398093"/>
  <text x="51" y="103" fill="#edf7ff" font-size="18" font-weight="600">01 / Dual-image template</text><text x="523" y="101" text-anchor="end" fill="#9eb0bf" font-size="11">DEFAULT</text>
  <text x="598" y="103" fill="#edf7ff" font-size="18" font-weight="600">02 / Single guide + text</text><text x="1070" y="101" text-anchor="end" fill="#77dae9" font-size="11">NO ORIGINAL PHOTO</text>
  <g fill="#0c1821" stroke="#365767"><rect x="51" y="131" width="149" height="55" rx="7"/><rect x="51" y="200" width="149" height="55" rx="7"/><rect x="321" y="158" width="190" height="76" rx="9"/><rect x="598" y="131" width="160" height="55" rx="7"/><rect x="598" y="200" width="160" height="55" rx="7"/><rect x="875" y="158" width="190" height="76" rx="9"/></g>
  <g fill="#c2d3df" font-size="13" text-anchor="middle"><text x="126" y="153">Original photo</text><text x="126" y="174" fill="#79d5e6" font-size="11">image_1</text><text x="126" y="221">Studio guide</text><text x="126" y="244" fill="#79d5e6" font-size="11">image_2</text><text x="416" y="187" fill="#edf7ff">Qwen Image 2.1</text><text x="416" y="209" font-size="11">AnyAngle / Qwen base</text><text x="678" y="153">Studio guide</text><text x="678" y="174" fill="#79d5e6" font-size="11">image_1</text><text x="678" y="222">Subject + style text</text><text x="678" y="244" font-size="11">Additional description</text><text x="970" y="187" fill="#edf7ff">Qwen Image 2.1</text><text x="970" y="209" fill="#79d5e6" font-size="11">Qwen base · LoRA 0</text></g>
  <g fill="none" stroke="#50c9df" stroke-width="2" marker-end="url(#arrow)"><path d="M201 158H247V182H312"/><path d="M201 227H247V209H312"/><path d="M758 158H817V182H866"/><path d="M758 227H817V209H866"/></g>
  <text x="51" y="288" fill="#93aebb" font-size="12">Swap image roles to match your encoder connections.</text><text x="51" y="308" fill="#93aebb" font-size="12">Existing default instructions stay unchanged.</text>
  <text x="598" y="288" fill="#a5c6d0" font-size="12">Pose / Depth / Canny / 3D composition</text><text x="598" y="308" fill="#a5c6d0" font-size="12">Choose single-guide mode, describe the subject, then Apply.</text>
  <rect x="28" y="350" width="1064" height="63" rx="10" fill="#11202a" stroke="#304b5d"/><text x="49" y="376" fill="#72d6e6" font-size="12" font-weight="600">CUSTOM PROMPT</text><text x="49" y="397" fill="#b5c7d4" font-size="12">Exact text output, including image tags and line breaks. Leave blank to compose the prompt in your workflow.</text>
  </g>
</svg>
